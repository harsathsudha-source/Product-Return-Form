<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Return Request Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Product Return Request</h1>
            <p>We're sorry that your purchase didn't work out.</p>
            <p>Please complete the form below to request a return.</p>
        </div>

        <form action="#" method="get">
            <h2>Customer Information</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name" required minlength="3">
                </div>
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email"
                           placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="Enter 10 digit number"
                           pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label for="order">Order ID *</label>
                    <input type="text" id="order" name="order"
                           placeholder="Enter your order ID" required>
                </div>
            </div>

            <h2>Product Information</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="product">Product Name *</label>
                    <input type="text" id="product" name="product"
                           placeholder="Enter product name" required>
                </div>
                <div class="form-group">
                    <label for="date">Date of Purchase *</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <label for="category">Product Category *</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option>Electronics</option>
                        <option>Clothing</option>
                        <option>Home Appliances</option>
                        <option>Accessories</option>
                        <option>Others</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity *</label>
                    <input type="number" id="quantity" name="quantity"
                           min="1" max="10" value="1" required>
                </div>
            </div>

            <h2>Return Details</h2>
            <div class="form-group">
                <label for="reason">Reason for Return *</label>
                <select id="reason" name="reason" required>
                    <option value="">Select a reason</option>
                    <option>Damaged Product</option>
                    <option>Wrong Product Delivered</option>
                    <option>Product Not as Described</option>
                    <option>Size or Fit Issue</option>
                    <option>Quality Issue</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Product Condition *</label>
                <div class="radio-group">
                    <label><input type="radio" name="condition" value="Unused" required> Unused</label>
                    <label><input type="radio" name="condition" value="Opened"> Opened</label>
                    <label><input type="radio" name="condition" value="Damaged"> Damaged</label>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Additional Description</label>
                <textarea id="description" name="description" rows="4" maxlength="500"
                          placeholder="Explain the reason for returning the product..."></textarea>
            </div>

            <div class="form-group">
                <label for="image">Upload Product Image</label>
                <input type="file" id="image" name="image" accept="image/*">
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="confirmation" required>
                    I confirm that the information provided is correct.
                </label>
            </div>

            <div class="button-group">
                <button type="submit" class="submit-btn">Submit Request</button>
                <button type="reset" class="reset-btn">Reset Form</button>
            </div>
            <p class="note">* All marked fields are mandatory.</p>
        </form>

        <footer>
            <p>© 2026 Product Return Management System</p>
        </footer>
    </div>
</body>
</html>
